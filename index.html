<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                background-color: #1a1c1e;
            }

            /* Header Style */
            header {
                height: 60px;
                background-color: #2d5a27; /* Hijau seperti gambar */
                display: flex;
                align-items: center;
                padding: 0 20px;
                color: white;
                border-bottom: 2px solid #3d3d3d;
            }

            header h1 {
                font-family: "Times New Roman", Times, serif;
                font-style: italic;
                font-size: 24px;
                margin: 0;
                margin-left: 10px;
            }

            #main-container {
                display: flex;
                flex: 1;
                width: 100%;
                height: calc(100% - 60px);
            }

            #map {
                flex: 1;
                height: 100%;
            }

            /* Sidebar Style (Dark Mode) */
            #sidebar {
                width: 300px;
                background-color: #1a1c23;
                color: #ffffff;
                padding: 20px;
                font-family: Arial, sans-serif;
                border-left: 1px solid #333;
                overflow-y: auto;
            }

            .sidebar-title {
                font-size: 14px;
                color: #bbb;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
            }

            .info-box {
                background-color: #252830;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 10px;
                border-left: 4px solid #2d5a27;
            }

            .info-label {
                font-size: 11px;
                color: #888;
                text-transform: uppercase;
                margin-bottom: 5px;
            }

            .info-value {
                font-size: 16px;
                font-weight: bold;
                color: #4caf50; /* Warna hijau untuk value */
            }

            .btn {
                width: 100%;
                padding: 10px;
                margin-top: 5px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                color: white;
            }

            .btn-search { background-color: #2d5a27; }
            .btn-reset { background-color: #c62828; }
            .btn-export { background-color: #0277bd; margin-top: 15px; }

        </style>
        <title>LotFinder</title>
    </head>
    <body>
        <header>
            <img src="https://via.placeholder.com/40x40" alt="Logo" style="border-radius:50%;"> 
            <h1>LotFinder</h1>
        </header>

        <div id="main-container">
            <div id="map"></div>
            
            <div id="sidebar">
                <div class="sidebar-title">
                    <i class="fa fa-cog"></i> &nbsp; Tetapan Paparan
                </div>

                <div style="margin-bottom: 20px;">
                    <div class="info-label" style="color:white; margin-bottom:10px;">🌍 Land Explorer</div>
                    <input type="text" id="searchInput" placeholder="Cari No Lot..." style="width:90%; padding:8px; border-radius:4px; border:none; background:#333; color:white;">
                    <button class="btn btn-search">Cari Lot</button>
                    <button class="btn btn-reset" onclick="location.reload()">Reset Peta</button>
                    <button class="btn btn-export">📄 Export Detail + Map (PDF)</button>
                </div>

                <div class="info-box">
                    <div class="info-label">Total Lot</div>
                    <div class="info-value">67</div>
                </div>

                <div class="info-box">
                    <div class="info-label">No Lot Dipilih</div>
                    <div id="side_no_lot" class="info-value">-</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Nama Pemilik</div>
                    <div id="side_pemilik" class="info-value">-</div>
                </div>

                <div class="info-box">
                    <div class="info-label">Luas Lot</div>
                    <div id="side_luas" class="info-value">-</div>
                </div>
            </div>
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/LOT_1.js"></script>
        <script src="data/lotfinal_2.js"></script>
        <script src="data/TANDA_SEMPADAN_3.js"></script>
        
        <script>
        var map = L.map('map', {
            zoomControl:true, maxZoom:28, minZoom:1
        }).fitBounds([[2.103071734769065,102.5210196581552],[2.104320052250617,102.52314267639126]]);
        
        var hash = new L.Hash(map);
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        map.createPane('pane_GoogleSatelliteHybrid_0');
        map.getPane('pane_GoogleSatelliteHybrid_0').style.zIndex = 400;
        var layer_GoogleSatelliteHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelliteHybrid_0',
            opacity: 1.0,
            minZoom: 1,
            maxZoom: 28,
        }).addTo(map);

        function pop_lotfinal_2(feature, layer) {
            layer.on({
                click: function(e) {
                    // Update Sidebar secara automatik bila lot diklik
                    document.getElementById('side_no_lot').innerText = feature.properties['NO_LOT'] || '-';
                    document.getElementById('side_pemilik').innerText = feature.properties['tsp — pe'] || 'ALI BIN ABU'; // Contoh fallback jika null
                    document.getElementById('side_luas').innerText = (feature.properties['AREA'] || '0') + " m²";
                }
            });
        }

        function style_lotfinal_2_0() {
            return {
                pane: 'pane_lotfinal_2',
                opacity: 1,
                color: 'rgba(255,255,255,0.5)',
                weight: 1.0, 
                fill: true,
                fillOpacity: 0.6,
                fillColor: 'rgba(76,175,80,1.0)', // Warna hijau lot
                interactive: true,
            }
        }

        map.createPane('pane_lotfinal_2');
        map.getPane('pane_lotfinal_2').style.zIndex = 402;
        var layer_lotfinal_2 = new L.geoJson(json_lotfinal_2, {
            pane: 'pane_lotfinal_2',
            onEachFeature: pop_lotfinal_2,
            style: style_lotfinal_2_0,
        }).addTo(map);

        // Fungsi Search
        var searchControl = new L.Control.Search({
            layer: layer_lotfinal_2,
            initial: false,
            hideMarkerOnCollapse: true,
            propertyName: 'NO_LOT'
        });
        
        searchControl.on('search:locationfound', function(e) {
            document.getElementById('side_no_lot').innerText = e.layer.feature.properties['NO_LOT'];
            document.getElementById('side_pemilik').innerText = e.layer.feature.properties['tsp — pe'];
            document.getElementById('side_luas').innerText = e.layer.feature.properties['AREA'] + " m²";
        });

        map.addControl(searchControl);
        </script>
    </body>
</html>
