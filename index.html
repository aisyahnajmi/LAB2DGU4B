<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
            /* Reset & Base Style */
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* Header Green Bar */
            header {
                background-color: #1b5e20; /* Hijau pekat seperti gambar */
                color: white;
                padding: 10px 20px;
                display: flex;
                align-items: center;
                height: 50px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                z-index: 1000;
            }
            header img { height: 35px; margin-right: 15px; }
            header h1 { font-size: 1.2rem; margin: 0; font-style: italic; font-weight: 300; }

            /* Main Layout */
            #main-container {
                display: flex;
                flex: 1;
                width: 100%;
                position: relative;
            }

            /* Map Container */
            #map {
                flex: 1;
                height: 100%;
            }

            /* Sidebar Panel (Dark Theme) */
            #sidebar {
                width: 300px;
                background-color: #1a1c1e; /* Warna gelap background sidebar */
                color: #e0e0e0;
                padding: 20px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 15px;
                z-index: 999;
                box-shadow: -2px 0 5px rgba(0,0,0,0.3);
            }

            /* Sidebar Elements Style */
            .sidebar-title { color: #81c784; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
            
            .search-box { display: flex; flex-direction: column; gap: 5px; }
            .search-box input { 
                padding: 10px; background: #2c2e31; border: 1px solid #3f4246; 
                color: white; border-radius: 4px; 
            }
            
            .btn { 
                padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; 
            }
            .btn-search { background-color: #2e7d32; }
            .btn-reset { background-color: #c62828; }
            .btn-export { background-color: #0277bd; margin-top: 5px; }

            .info-card {
                background-color: #2c2e31;
                padding: 12px;
                border-radius: 6px;
                border-left: 4px solid #2e7d32;
            }
            .info-label { font-size: 0.75rem; color: #8bc34a; text-transform: uppercase; font-weight: bold; }
            .info-value { font-size: 1rem; color: #ffffff; margin-top: 2px; }

        </style>
        <title>LotFinder GIS</title>
    </head>
    <body>

        <header>
            <img src="https://via.placeholder.com/100x40/ffffff/000000?text=LOGO" alt="Logo"> <h1>smart resident</h1>
        </header>

        <div id="main-container">
            <div id="map"></div>

            <div id="sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-cog"></i> Tetapan Paparan
                </div>

                <div class="sidebar-title">
                    <i class="fas fa-globe"></i> Land Explorer
                </div>

                <div class="search-box">
                    <input type="text" id="lotInput" placeholder="Masukkan No Lot...">
                    <button class="btn btn-search">Cari Lot</button>
                    <button class="btn btn-reset">Reset Peta</button>
                    <button class="btn btn-export"><i class="fas fa-file-pdf"></i> Export Detail + Map (PDF)</button>
                </div>

                <hr style="border: 0.5px solid #3f4246; width: 100%;">

                <div class="info-card">
                    <div class="info-label">Total Lot</div>
                    <div class="info-value">67</div>
                </div>

                <div class="info-card">
                    <div class="info-label">No Lot Dipilih</div>
                    <div class="info-value" id="display-lot">11462</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Nama Pemilik</div>
                    <div class="info-value" id="display-nama">ALI BIN ABU</div>
                </div>

                <div class="info-card">
                    <div class="info-label">Luas Lot</div>
                    <div class="info-value" id="display-luas">106.825 m²</div>
                </div>
            </div>
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/LOT_1.js"></script>
        <script src="data/lotfinal_2.js"></script>
        <script src="data/TANDA_SEMPADAN_3.js"></script>
        
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[2.103071734769065,102.5210196581552],[2.104320052250617,102.52314267639126]]);
        
        // Pindahkan Zoom Control ke atas kiri map
        L.control.zoom({ position: 'topleft' }).addTo(map);

        var layer_GoogleSatelliteHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            opacity: 1.0,
            minZoom: 1,
            maxZoom: 28,
        }).addTo(map);

        // --- Tambahkan baki logic Leaflet anda di sini (pop_LOT_1, style, dll) ---
        // Anda boleh copy semula baki koding script asal anda ke dalam bahagian ini
        
        </script>
    </body>
</html>
