<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <style>
            html, body {
                width: 100%; height: 100%; padding: 0; margin: 0;
                overflow: hidden; display: flex; flex-direction: column;
                background-color: #1a1c1e;
            }

            /* Header Hijau LotFinder */
            header {
                height: 60px;
                background-color: #2d5a27; 
                display: flex; align-items: center; padding: 0 20px;
                color: white; border-bottom: 2px solid #3d3d3d;
            }

            header h1 {
                font-family: "Times New Roman", Times, serif;
                font-style: italic; font-size: 26px; margin: 0;
            }

            #main-container { display: flex; flex: 1; width: 100%; height: calc(100% - 60px); }

            #map { flex: 1; height: 100%; }

            /* Sidebar Dark Mode */
            #sidebar {
                width: 320px; background-color: #1a1c23;
                color: #ffffff; padding: 15px;
                font-family: Arial, sans-serif; border-left: 1px solid #333;
                overflow-y: auto;
            }

            .sidebar-title { font-size: 14px; color: #bbb; margin-bottom: 15px; }

            .info-box {
                background-color: #252830; padding: 12px;
                border-radius: 8px; margin-bottom: 10px;
                border-left: 4px solid #4caf50;
            }

            .info-label { font-size: 10px; color: #888; text-transform: uppercase; }
            .info-value { font-size: 15px; font-weight: bold; color: #4caf50; margin-top: 4px; }

            .btn {
                width: 100%; padding: 10px; margin-top: 8px;
                border: none; border-radius: 5px; cursor: pointer;
                font-weight: bold; color: white;
            }
            .btn-search { background-color: #2d5a27; }
            .btn-reset { background-color: #c62828; }
            .btn-export { background-color: #0277bd; margin-top: 15px; }

            input {
                width: 93%; padding: 10px; border-radius: 4px;
                border: none; background: #333; color: white; margin-bottom: 5px;
            }
        </style>
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <title>LotFinder</title>
    </head>
    <body>
        <header>
            <h1>LotFinder</h1>
        </header>

        <div id="main-container">
            <div id="map"></div>
            
            <div id="sidebar">
                <div class="sidebar-title">⚙️ Tetapan Paparan</div>
                
                <div style="margin-bottom: 20px;">
                    <div style="color:white; margin-bottom:10px; font-size: 14px;">🌍 Land Explorer</div>
                    <input type="text" id="inputSearch" placeholder="Masukkan No Lot...">
                    <button class="btn btn-search" onclick="searchLot()">Cari Lot</button>
                    <button class="btn btn-reset" onclick="location.reload()">Reset Peta</button>
                    <button class="btn btn-export">📄 Export Detail + Map (PDF)</button>
                </div>

                <div class="info-box">
                    <div class="info-label">TOTAL LOT</div>
                    <div class="info-value">67</div>
                </div>

                <div class="info-box">
                    <div class="info-label">NO LOT DIPILIH</div>
                    <div id="side_no_lot" class="info-value">-</div>
                </div>

                <div class="info-box">
                    <div class="info-label">NAMA PEMILIK</div>
                    <div id="side_pemilik" class="info-value">-</div>
                </div>

                <div class="info-box">
                    <div class="info-label">LUAS LOT</div>
                    <div id="side_luas" class="info-value">-</div>
                </div>
            </div>
        </div>

        <script src="js/leaflet.js"></script>
        <script src="data/lotfinal_2.js"></script>
        
        <script>
            var map = L.map('map', {zoomControl: true}).fitBounds([[2.1030, 102.5210],[2.1043, 102.5231]]);
            
            L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}').addTo(map);

            // Fungsi untuk paparkan data ke sidebar
            function updateSidebar(props) {
                document.getElementById('side_no_lot').innerText = props.NO_LOT || '-';
                document.getElementById('side_pemilik').innerText = props['tsp — pe'] || 'N/A';
                document.getElementById('side_luas').innerText = props.AREA ? props.AREA + " m²" : '-';
            }

            // Style Hijau untuk setiap lot (seperti dalam gambar)
            function styleLot(feature) {
                return {
                    fillColor: '#4caf50', // Warna Hijau
                    weight: 1.5,
                    opacity: 1,
                    color: 'white', // Garisan putih halus antara lot
                    fillOpacity: 0.5 // Ketelusan supaya nampak satelit di bawah
                };
            }

            var layer_lot = L.geoJson(json_lotfinal_2, {
                style: styleLot,
                onEachFeature: function(feature, layer) {
                    layer.on('click', function() {
                        // Highlight lot yang diklik
                        layer_lot.setStyle(styleLot); 
                        layer.setStyle({fillColor: '#ffeb3b', fillOpacity: 0.8}); // Tukar kuning bila diklik
                        updateSidebar(feature.properties);
                    });
                }
            }).addTo(map);

            function searchLot() {
                var val = document.getElementById('inputSearch').value;
                layer_lot.eachLayer(function(layer) {
                    if (layer.feature.properties.NO_LOT == val) {
                        map.fitBounds(layer.getBounds());
                        layer.setStyle({fillColor: '#ffeb3b', fillOpacity: 0.8});
                        updateSidebar(layer.feature.properties);
                    }
                });
            }
        </script>
    </body>
</html>
