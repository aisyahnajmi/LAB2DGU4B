<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        /* Header styling */
        #header {
            width: 100%;
            background-color: white;
            text-align: center;
            padding: 10px 0;
            font-weight: bold;
            font-size: 24px;
            border-bottom: 2px solid #ccc;
            font-family: Arial, sans-serif;
        }
        /* Container for sidebar and map */
        #main-container {
            display: flex;
            flex: 1;
            width: 100%;
        }
        /* Sidebar styling */
        #sidebar {
            width: 250px;
            padding: 20px;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            font-family: Arial, sans-serif;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        .select-box {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        </style>
        <title>Kawasan Perumahan</title>
    </head>
    <body>
        <div id="header">KAWASAN PERUMAHAN</div>
        
        <div id="main-container">
            <div id="sidebar">
                <strong>Cari No. Lot:</strong>
                <select id="selectLot" class="select-box" onchange="zoomToLot(this.value)">
                    <option value="">-- Pilih No Lot --</option>
                </select>
            </div>
            <div id="map"></div>
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/LOT_1.js"></script>
        <script src="data/lotfinaltest_2.js"></script>
        <script src="data/TANDA_SEMPADAN_3.js"></script>
        
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[2.1034521062399696,102.52110551111741],[2.1040268754557534,102.52208302310447]]);
        
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        // --- LAYER SATELLITE ---
        map.createPane('pane_GoogleSatelliteHybrid_0');
        map.getPane('pane_GoogleSatelliteHybrid_0').style.zIndex = 400;
        var layer_GoogleSatelliteHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelliteHybrid_0',
            opacity: 1.0,
            maxZoom: 28,
        });
        map.addLayer(layer_GoogleSatelliteHybrid_0);

        // --- POPUP & STYLE ---
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function style_LOT_1_0() {
            return {
                pane: 'pane_LOT_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                weight: 1.0, 
                fill: true,
                fillOpacity: 0.6,
                fillColor: 'rgba(152,125,183,1.0)',
                interactive: true,
            }
        }

        map.createPane('pane_LOT_1');
        map.getPane('pane_LOT_1').style.zIndex = 401;
        var layer_LOT_1 = new L.geoJson(json_LOT_1, {
            pane: 'pane_LOT_1',
            style: style_LOT_1_0,
            onEachFeature: function(feature, layer) {
                var popupContent = '<table><tr><td colspan="2"><strong>No Lot: </strong>' + (feature.properties['NO_LOT'] || 'N/A') + '</td></tr></table>';
                layer.bindPopup(popupContent);
            }
        });
        map.addLayer(layer_LOT_1);

        // --- DATA UNTUK DROPDOWN & ZOOM ---
        var layer_lotfinaltest_2 = new L.geoJson(json_lotfinaltest_2);
        
        // Isi dropdown secara automatik dari data lotfinaltest_2
        var select = document.getElementById("selectLot");
        var lotFeatures = json_lotfinaltest_2.features;
        
        // Susun nombor lot mengikut turutan
        lotFeatures.sort((a, b) => (a.properties.NO_LOT > b.properties.NO_LOT) ? 1 : -1);

        lotFeatures.forEach(function(feature) {
            if (feature.properties.NO_LOT) {
                var el = document.createElement("option");
                el.textContent = feature.properties.NO_LOT;
                el.value = feature.properties.NO_LOT;
                select.appendChild(el);
            }
        });

        // Fungsi untuk zoom bila lot dipilih
        function zoomToLot(lotNo) {
            if (lotNo === "") return;
            layer_LOT_1.eachLayer(function(layer) {
                if (layer.feature.properties.NO_LOT == lotNo) {
                    map.fitBounds(layer.getBounds());
                    layer.openPopup();
                }
            });
        }

        // --- TAMBAH CONTROLS ---
        L.control.zoom({ position: 'topleft' }).addTo(map);
        
        var baseMaps = { "Google Satellite": layer_GoogleSatelliteHybrid_0 };
        var overlayMaps = { "Lot Tanah": layer_LOT_1 };
        L.control.layers(baseMaps, overlayMaps).addTo(map);

        </script>
    </body>
</html>
